# Local development services (produktspecifikation §10.5).
# Ports are bound to 127.0.0.1 only and offset from the defaults to avoid clashing with other projects.
name: agentor-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev # local superuser, dev only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/roles.sql:/agentor/roles.sql:ro
      - ./db/init-dev.sh:/docker-entrypoint-initdb.d/10-agentor-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentor']
      interval: 2s
      timeout: 3s
      retries: 30

  # Dedicated Redis for BullMQ: never evict keys, persist with AOF (produktspecifikation §10.2).
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'

volumes:
  pgdata:
  redisdata:
