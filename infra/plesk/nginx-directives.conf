# Plesk → app.agentor.dk → Apache & nginx Settings → Additional nginx directives (Proxy mode off).
# Applied by infra/scripts/server-setup.sh. Regex locations avoid clashing with Plesk's own
# "location /"; the first match wins, so ingest routes come first.
location ~ ^/hooks/ {
    proxy_pass http://127.0.0.1:3411;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
location = /billing/quickpay {
    proxy_pass http://127.0.0.1:3411;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
location ~ ^/ {
    proxy_pass http://127.0.0.1:3410;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # No websockets in production (only dev HMR uses them): never forward Upgrade (h2c smuggling).
    proxy_set_header Connection "";
}
