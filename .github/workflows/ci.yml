name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Test-only credentials for the throwaway CI database. Not secrets.
  DATABASE_ADMIN_URL: postgres://postgres:postgres_ci@127.0.0.1:5432/postgres
  DATABASE_URL_OWNER: postgres://agentor_owner:agentor_owner_ci@127.0.0.1:5432/agentor
  DATABASE_URL_WEB: postgres://agentor_web:agentor_web_ci@127.0.0.1:5432/agentor
  DATABASE_URL_WORKER: postgres://agentor_worker:agentor_worker_ci@127.0.0.1:5432/agentor
  DATABASE_URL_SUPPORT: postgres://agentor_support:agentor_support_ci@127.0.0.1:5432/agentor
  DATABASE_URL_OPS: postgres://agentor_readonly_ops:agentor_ops_ci@127.0.0.1:5432/agentor
  REDIS_URL: redis://127.0.0.1:6379
  APP_URL: http://localhost:3000
  SMTP_URL: smtp://127.0.0.1:1025
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  # Billing runs against the mock QuickPay (no network); the key only signs mock callbacks.
  QUICKPAY_MODE: mock
  QUICKPAY_PRIVATE_KEY: ci-mock-callback-signing-key
  CVR_PROVIDER: fixture
  CONNECTOR_MODE: mock
  # Signup (PLAN-SIGNUP): Google/Microsoft through the local mock identity provider, and a dev
  # version for the terms until agentor.dk publishes them.
  SSO_MODE: mock
  LEGAL_DEV_VERSION: ci
  MAILPIT_API: http://127.0.0.1:8025/api/v1

jobs:
  verify:
    name: install → typecheck → lint → unit → isolation → build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install (frozen lockfile, supply-chain policies)
        run: pnpm install --frozen-lockfile
      - name: Throwaway key box KEK (outside the checkout)
        run: node infra/scripts/dev-kek.mjs "$RUNNER_TEMP/kek/dev-kek.pem" >> "$GITHUB_ENV"
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Create database roles
        env:
          PGPASSWORD: postgres_ci
        run: >-
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -v owner_password=agentor_owner_ci -v web_password=agentor_web_ci
          -v worker_password=agentor_worker_ci -v support_password=agentor_support_ci
          -v ops_password=agentor_ops_ci -v db_name=agentor -f infra/db/roles.sql
      - name: Migrate (as agentor_owner)
        run: pnpm db:migrate
      - name: RLS structure check
        run: pnpm db:check-rls
      - name: Tenant isolation suite
        run: pnpm test:isolation
      - name: Isolation canary (suite must fail with RLS disabled)
        run: |
          pnpm --filter @agentor/db test:isolation:canary flows
          pnpm --filter @agentor/db test:isolation:canary connection_secrets
          pnpm --filter @agentor/db test:isolation:canary memberships
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @agentor/web exec playwright install --with-deps chromium
      - name: End-to-end tests (1440 × 900)
        env:
          AGENTOR_DEV_PAGES: '1'
        run: pnpm --filter @agentor/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: secrets, SAST, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: SAST (Semgrep)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.180.0
          semgrep scan --config p/default --config p/typescript --config p/nodejs
          --error --metrics=off --exclude docs --exclude node_modules
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
